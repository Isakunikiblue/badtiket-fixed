  <style>
    /* Reset margin dan padding agar tidak ada celah putih di pinggir */

      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* Menghilangkan scrollbar ganda */
      background-color: #F4F7F6; /* Warna abu-abu background dashboard */

    /* Membuat Iframe menutupi seluruh layar browser */

      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
